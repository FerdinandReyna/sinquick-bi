[pytest]
addopts = -p no:cacheprovider
markers =
    caso(id): ID del caso en el catálogo
    humo: verificación mínima de un despliegue (staging)
    integracion: integración entre la carga, el data warehouse y las vistas
    sistema: comportamiento del sistema completo
    aceptacion: criterios de aceptación de las historias de usuario
    seguridad: permisos y entradas maliciosas
    rendimiento: tiempos de carga y consulta
